services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: log-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: log-backend
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      LOG_INDEX: logs
      RETENTION_DAYS: "7"
      SYSLOG_HOST: "0.0.0.0"
      SYSLOG_PORT: "5514"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,https://127.0.0.1"
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
      - "5514:5514/udp"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        # Empty = same-origin /api via nginx edge proxy (SaaS / appliance HTTPS)
        VITE_API_URL: ""
    container_name: log-frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: log-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  opensearch_data:
